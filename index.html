<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OJT PROJECT</title>
    <style>* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb);
}

/* NAVBAR */
nav {
    background-color: #1565c0;
    padding: 18px 40px;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 30px;
}

nav a {
    color: white;
    text-decoration: none;
    font-size: 16px;
    font-weight: bold;
}

nav a:hover {
    color: #bbdefb;
}

/* MAIN CONTAINER */
.login-container {
    width: 400px;
    padding: 45px;
    margin: 150px auto;
    background-color: white;
    border-radius: 15px;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
    text-align: center;
}

/* HEADING */
.login-container h1 {
    color: #1565c0;
    font-size: 36px;
    margin-bottom: 35px;
    text-transform: capitalize;
}

/* BUTTONS */
.login-container button {
    width: 220px;
    padding: 13px;
    border: none;
    border-radius: 8px;
    background-color: #1565c0;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.login-container button:hover {
    background-color: #0d47a1;
}
</style>
</head>
<body>

        <a href="login.html">Login</a>
        <a href="register.html">register</a>

    </nav>

    <button
     onclick="window.location.href='register.html'">Registration
    </button>
    <br>
    <br>
  <button
     onclick="window.location.href='login.html'">Login
    </button>
    <br>
    <br>
    </div>
</div>
</body>
</html
